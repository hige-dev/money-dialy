services:
  dynamodb-local:
    extends:
      file: lambda/compose.local.yaml
      service: dynamodb-local

  backend:
    image: golang:1.25.5
    working_dir: /work/lambda
    network_mode: host
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      GOMODCACHE: /go/pkg/mod
      GOCACHE: /go-cache
    volumes:
      - ./lambda:/work/lambda:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/go-cache
    command: ['go', 'run', './cmd/local', '-port', '${BACKEND_PORT:-8080}', '-dynamo-endpoint', 'http://127.0.0.1:${DYNAMODB_PORT:-8000}']
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', '--output', '/dev/null', '--header', 'Content-Type: application/json', '--header', 'X-Auth-Token: money-diary-local', '--data', '{"action":"getMyRole"}', 'http://127.0.0.1:${BACKEND_PORT:-8080}/api']
      interval: 5s
      timeout: 3s
      start_period: 180s
      retries: 12

  frontend:
    image: node:22
    working_dir: /work/frontend
    network_mode: host
    depends_on:
      backend:
        condition: service_healthy
    environment:
      LOCAL_API_URL: http://127.0.0.1:${BACKEND_PORT:-8080}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      npm_config_cache: /npm-cache
    volumes:
      - ./frontend:/work/frontend:ro
      - frontend-modules:/work/frontend/node_modules
      - npm-cache:/npm-cache
    command: ['sh', '-c', 'npm ci --no-audit --no-fund && npm run dev:local -- --host 127.0.0.1 --port "$${FRONTEND_PORT}" --strictPort']
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:" + process.env.FRONTEND_PORT).then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));']
      interval: 5s
      timeout: 3s
      start_period: 180s
      retries: 12

volumes:
  dynamodb-data:
  go-mod-cache:
  go-build-cache:
  frontend-modules:
  npm-cache:
