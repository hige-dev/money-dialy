services:
  dynamodb-local:
    # 名前付きボリュームにデータファイルを作成できるユーザーで起動する。
    user: root
    image: amazon/dynamodb-local:3.3.0
    command: '-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data'
    ports:
      - '127.0.0.1:${DYNAMODB_PORT:-8000}:8000'
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    healthcheck:
      # 認証なしのGETはエラー応答になるが、HTTP応答が返れば起動済みと判定する。
      test: ['CMD', 'curl', '--silent', '--show-error', '--output', '/dev/null', 'http://127.0.0.1:8000']
      interval: 3s
      timeout: 3s
      start_period: 20s
      retries: 20
volumes:
  dynamodb-data:
