<script>
(() => {
  'use strict';

  const state = { sessionId: '', user: null, data: null, month: new Date(new Date().getFullYear(), new Date().getMonth(), 1), selectedDay: new Date().getDate(), view: 'summary', activeMaster: 'members', editingRecord: null, topUpDraft: null, topUpRefreshPending: false, toastTimer: null, confirmed: false, fetchedAt: '', syncStatus: '', sessionEpoch: 0, refreshSequence: 0 };
  const sessionStorageKey = 'money-diary-family-session-v1';
  const dataStorageKey = 'money-diary-family-data-v1';
  const deploymentGeneration = document.querySelector('#auth-bootstrap')?.dataset.generation || '';
  const views = ['summary', 'input', 'calendar', 'settings'];
  const pendingForms = new WeakSet();
  const categoryColors = ['#728f75', '#d49b55', '#7e9db4', '#bb7e6d', '#9b8bb1', '#8ba293', '#c7ae61', '#82919a'];
  const $ = (selector, parent = document) => parent.querySelector(selector);
  const $$ = (selector, parent = document) => [...parent.querySelectorAll(selector)];
  const today = () => localDate(new Date());

  function localDate(date) {
    return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'), String(date.getDate()).padStart(2, '0')].join('-');
  }

  function money(amount) { return '¥' + (Number(amount) || 0).toLocaleString('ja-JP'); }
  function newRequestId() {
    if (window.crypto?.randomUUID) return window.crypto.randomUUID();
    return 'req_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  }
  function categoryColor(id) {
    const index = (state.data.categories || []).findIndex((category) => String(category.id) === String(id));
    return categoryColors[(index >= 0 ? index : Math.abs(String(id).split('').reduce((sum, character) => sum + character.charCodeAt(0), 0))) % categoryColors.length];
  }
  function active(records) { return (records || []).filter((record) => record.active === true || String(record.active).toLowerCase() === 'true'); }
  function lookup(records, id) { return (records || []).find((record) => String(record.id) === String(id)); }
  function labelFor(type, id, fallback = '未設定') { return lookup(state.data[type] || [], id)?.name || fallback; }
  function monthKey(date) { return String(date).slice(0, 7); }
  function expenseMonth(expense) { return monthKey(expense.date); }
  function byDateDescending(left, right) { return String(right.date).localeCompare(String(left.date)) || String(right.createdAt).localeCompare(String(left.createdAt)); }
  function announce(message, error = false) {
    const toast = $('#toast');
    toast.textContent = message;
    toast.classList.toggle('is-visible', Boolean(message));
    toast.classList.toggle('is-error', error);
    clearTimeout(state.toastTimer);
    if (message) state.toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 3200);
  }

  function apiWithSession(method, sessionId, ...args) {
    return new Promise((resolve, reject) => {
      if (!window.google?.script?.run) return reject(new Error('GASの実行環境で開いてください。'));
      const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler((error) => reject(new Error(error?.message || 'サーバー処理に失敗しました。')));
      runner[method](sessionId, ...args);
    });
  }

  function canEdit() { return state.confirmed && Boolean(state.sessionId && state.data); }

  function requireEditing() {
    if (canEdit()) return true;
    announce('最新データと利用権限を確認するまで、閲覧のみ利用できます。', true);
    return false;
  }

  async function api(method, ...args) {
    if (method !== 'getAppData' && !requireEditing()) throw new Error('最新データと利用権限を確認してください。');
    const sessionId = state.sessionId;
    const epoch = state.sessionEpoch;
    try {
      const result = await apiWithSession(method, sessionId, ...args);
      if (epoch !== state.sessionEpoch || sessionId !== state.sessionId) throw new Error('ログイン状態が変わったため、処理結果を破棄しました。');
      return result;
    } catch (error) {
      if (epoch === state.sessionEpoch && isRejectedSession(error)) clearAuthentication(error.message, true);
      throw error;
    }
  }

  function removeStoredData() {
    try { window.localStorage.removeItem(dataStorageKey); } catch (error) { /* 保存領域が利用できない場合も画面の削除は続けます。 */ }
  }

  function removeStoredSession() {
    try { window.localStorage.removeItem(sessionStorageKey); } catch (error) { /* 保存領域が利用できない場合も画面のログアウトは続けます。 */ }
    removeStoredData();
  }

  function isRejectedSession(error) {
    return /アプリのログイン状態が無効|このGoogleアカウントは利用を許可されていません/.test(String(error && error.message || ''));
  }

  function validAppData(data) {
    if (!data || typeof data !== 'object' || Array.isArray(data) || data.setupRequired !== false) return false;
    if (!data.user || typeof data.user.email !== 'string' || typeof data.user.name !== 'string' || !['admin', 'member'].includes(data.user.role)) return false;
    if (data.budget !== null && (!data.budget || typeof data.budget !== 'object' || Array.isArray(data.budget) || !Number.isFinite(Number(data.budget.amount)))) return false;
    return ['members', 'sources', 'categories', 'places', 'expenses', 'walletEntries', 'fixedCosts', 'emailRules', 'users'].every((key) =>
      Array.isArray(data[key]) && data[key].every((record) => record && typeof record === 'object' && !Array.isArray(record)));
  }

  function restoreStoredData(sessionId) {
    try {
      const value = window.localStorage.getItem(dataStorageKey);
      if (!value) return null;
      const saved = JSON.parse(value);
      if (saved.version !== 1 || !deploymentGeneration || saved.generation !== deploymentGeneration || saved.sessionId !== sessionId ||
          typeof saved.fetchedAt !== 'string' || !Number.isFinite(Date.parse(saved.fetchedAt)) || !validAppData(saved.data)) {
        removeStoredData(); return null;
      }
      return saved;
    } catch (error) { removeStoredData(); return null; }
  }

  function saveStoredData() {
    if (!deploymentGeneration || !validAppData(state.data)) { removeStoredData(); return; }
    try {
      window.localStorage.setItem(dataStorageKey, JSON.stringify({ version: 1, generation: deploymentGeneration, sessionId: state.sessionId, fetchedAt: state.fetchedAt, data: state.data }));
    } catch (error) { removeStoredData(); /* 容量不足などでも最新データの利用を続けます。 */ }
  }

  function updateEditingControls() {
    const disabled = !canEdit();
    const setupRequired = Boolean(state.data?.setupRequired);
    $$('.bottom-nav [data-view], [data-view-link], [data-month-step], #filter-member, #filter-source').forEach((control) => {
      if (control.tagName === 'A') return;
      control.disabled = setupRequired && control.dataset.view !== 'settings';
    });
    $$('#expense-form input, #expense-form select, #expense-form button, #settings-content input, #settings-content select, #settings-content button, [data-edit-expense], [data-delete-expense]').forEach((control) => {
      if (control.hasAttribute('data-master-tab')) return;
      if (disabled && !control.hasAttribute('data-sync-disabled')) {
        control.dataset.syncDisabled = control.disabled ? 'already' : 'true'; control.disabled = true;
      } else if (!disabled && control.hasAttribute('data-sync-disabled')) {
        if (control.dataset.syncDisabled === 'true') control.disabled = false;
        delete control.dataset.syncDisabled;
      }
    });
  }

  function renderSyncStatus() {
    const status = $('#data-sync-status');
    status.hidden = !state.data || (Boolean(state.data.setupRequired) && state.syncStatus === 'ready');
    const timestamp = state.fetchedAt ? new Date(state.fetchedAt).toLocaleString('ja-JP') : '';
    $('#data-sync-message').textContent = state.syncStatus === 'checking' ? '最新データを確認中（閲覧のみ）' :
      state.syncStatus === 'failed' ? '最新データを確認できていません（閲覧のみ）' : '最新データを確認しました';
    $('#data-sync-time').textContent = timestamp ? '取得日時: ' + timestamp : '';
    $('#retry-data-button').hidden = state.syncStatus !== 'failed';
    updateEditingControls();
  }

  function clearAuthentication(message, removeStorage = false) {
    state.sessionEpoch += 1; state.refreshSequence += 1;
    state.sessionId = ''; state.user = null; state.data = null; state.confirmed = false;
    state.fetchedAt = ''; state.syncStatus = ''; state.topUpDraft = null; state.topUpRefreshPending = false;
    if (removeStorage) removeStoredSession();
    $('#expense-form').reset(); delete $('#expense-form').dataset.requestAttempted;
    ['#settings-content', '#recent-transactions', '#input-transactions', '#calendar-day-transactions', '#category-breakdown', '#category-trend-months', '#category-trend-legend', '#wallet-balances', '#calendar-grid'].forEach((selector) => $(selector)?.replaceChildren());
    $$('#expense-form select, #filter-member, #filter-source').forEach((select) => select.replaceChildren());
    ['#account-name', '#user-avatar', '#budget-limit', '#budget-remaining', '#calendar-day-total', '#calendar-day-title', '#settings-role-note', '#data-sync-time', '#data-sync-message'].forEach((selector) => { $(selector).textContent = ''; });
    $('#summary-total').textContent = '0'; $('#budget-summary').hidden = true; $('#wallet-card').hidden = true;
    $('#app-shell').hidden = true; $('#login-screen').hidden = false; $('#data-sync-status').hidden = true;
    $('#login-status').textContent = message; $('#retry-login-button').hidden = true;
    $('#google-login-link').hidden = $('#google-login-link').dataset.enabled !== 'true';
    announce(''); updateEditingControls();
  }

  async function startAuthenticatedSession(sessionId, allowRestore = true) {
    state.sessionEpoch += 1; state.sessionId = sessionId; state.confirmed = false;
    $('#google-login-link').hidden = true;
    $('#login-status').textContent = 'Googleログインを確認しています。';
    try { window.localStorage.setItem(sessionStorageKey, sessionId); } catch (error) { /* このタブ内ではログインを続けます。 */ }
    const saved = allowRestore ? restoreStoredData(sessionId) : null;
    if (!allowRestore) removeStoredData();
    if (saved) {
      state.data = saved.data; state.user = saved.data.user; state.fetchedAt = saved.fetchedAt;
      state.syncStatus = 'checking';
      try { showApplication(); hydrateApp(); }
      catch (error) {
        removeStoredData(); state.data = null; state.user = null; state.fetchedAt = '';
        $('#app-shell').hidden = true; $('#login-screen').hidden = false;
      }
    }
    try { await refreshData('ログインしました'); }
    catch (error) { /* 更新状態またはログイン画面に失敗理由を表示済みです。 */ }
  }

  function initializeAuthentication() {
    const loginLink = $('#google-login-link');
    if (loginLink.dataset.enabled !== 'true') loginLink.hidden = true;
    const bootstrap = $('#auth-bootstrap');
    const sessionId = bootstrap ? bootstrap.dataset.sessionId : '';
    if (bootstrap) bootstrap.remove();
    if (sessionId) {
      startAuthenticatedSession(sessionId, false);
      return;
    }
    try {
      const storedSessionId = window.localStorage.getItem(sessionStorageKey);
      if (storedSessionId) startAuthenticatedSession(storedSessionId); else removeStoredData();
    } catch (error) {
      $('#login-status').textContent = 'このブラウザーではログイン状態を復元できません。Googleアカウントでログインしてください。';
    }
  }

  function showApplication() {
    $('#login-screen').hidden = true;
    $('#app-shell').hidden = false;
    $('#account-name').textContent = state.user.name || state.user.email;
    $('#user-avatar').textContent = Array.from(state.user.name || '家')[0];
  }

  function renderSetupRequired(data) {
    $('#settings-role-note').textContent = '初回設定が必要です。Usersシートに登録された管理者だけが実行できます。';
    $('#settings-content').innerHTML = '<section class="card settings-form"><h2>家族用シートを初期化</h2><p class="settings-help">既存データを消さず、不足するシートと見出しを追加します。初期利用者・支払元・カテゴリ・場所がない場合だけ登録します。</p><p class="settings-help">不足しているシート: ' + escapeHtml((data.missingTables || []).join('、')) + '</p><button class="primary-button" type="button" data-initialize-ledger>初期化する</button></section>';
    showView('settings');
    renderSyncStatus();
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
  }

  function hydrateApp() {
    fillSelects();
    renderAll();
    showView(state.view);
  }

  function fillSelect(select, records, placeholder, selected, includeAll) {
    if (!select) return;
    const choices = [];
    if (includeAll) choices.push({ value: 'all', label: 'すべて' });
    else if (placeholder !== null) choices.push({ value: '', label: placeholder });
    active(records).forEach((record) => choices.push({ value: String(record.id), label: String(record.name) }));
    select.replaceChildren(...choices.map((choice) => {
      const option = document.createElement('option'); option.value = choice.value; option.textContent = choice.label; return option;
    }));
    if (selected !== undefined && choices.some((choice) => choice.value === String(selected))) select.value = String(selected);
  }

  function fillSelects() {
    const members = state.data.members || [];
    const sources = state.data.sources || [];
    fillSelect($('#filter-member'), members, null, $('#filter-member').value || 'all', true);
    fillSelect($('#filter-source'), sources, null, $('#filter-source').value || 'all', true);
    const form = $('#expense-form');
    const memberValue = form.elements.memberId.value || state.user.defaultMemberId;
    const sourceValue = form.elements.sourceId.value || (active(sources)[0] || {}).id || '';
    fillSelect(form.elements.memberId, members, '利用者を選択', memberValue, false);
    fillSelect(form.elements.sourceId, sources, '支払元を選択', sourceValue, false);
    fillSelect(form.elements.categoryId, state.data.categories || [], 'カテゴリを選択', form.elements.categoryId.value, false);
    fillSelect(form.elements.placeId, state.data.places || [], '場所（任意）', form.elements.placeId.value, false);
    const settings = $('#settings-content');
    if (!settings) return;
    fillSelect($('[name="defaultMemberId"]', settings), members, '既定利用者を選択', undefined, false);
    fillSelect($('[name="topupSourceId"]', settings), sources.filter((source) => source.walletEnabled), '支払元を選択', state.topUpDraft?.topupSourceId, false);
    ['fixedCostForm', 'emailRuleForm'].forEach((formId) => {
      const formElement = $('#' + formId, settings);
      if (!formElement) return;
      fillSelect(formElement.elements.sourceId, sources, '指定しない', formElement.elements.sourceId.value, false);
      fillSelect(formElement.elements.categoryId, state.data.categories, '指定しない', formElement.elements.categoryId.value, false);
      fillSelect(formElement.elements.placeId, state.data.places, '指定しない', formElement.elements.placeId.value, false);
    });
  }

  function showView(view) {
    if (!views.includes(view) || (state.data?.setupRequired && view !== 'settings')) return;
    state.view = view;
    views.forEach((name) => {
      const panel = $('#view-' + name);
      panel.hidden = name !== view;
      panel.classList.toggle('is-active', name === view);
    });
    $$('.bottom-nav [data-view]').forEach((button) => {
      const selected = button.dataset.view === view;
      button.classList.toggle('is-active', selected);
      if (selected) button.setAttribute('aria-current', 'page'); else button.removeAttribute('aria-current');
    });
    window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }

  function selectedExpenses() {
    const memberId = $('#filter-member')?.value || 'all';
    const sourceId = $('#filter-source')?.value || 'all';
    return (state.data.expenses || []).filter((expense) => expenseMonth(expense) === monthKey(localDate(state.month)) &&
      (memberId === 'all' || String(expense.memberId) === memberId) && (sourceId === 'all' || String(expense.sourceId) === sourceId));
  }

  function setMonthLabel() {
    const label = state.month.getFullYear() + '年 ' + (state.month.getMonth() + 1) + '月';
    $$('[data-month-label]').forEach((node) => { node.textContent = label; });
  }

  function renderAll() {
    if (!state.data || state.data.setupRequired) return;
    setMonthLabel();
    renderSummary();
    renderTransactions($('#recent-transactions'), selectedExpenses().sort(byDateDescending).slice(0, 8), false);
    renderTransactions($('#input-transactions'), (state.data.expenses || []).slice().sort(byDateDescending).slice(0, 8), true);
    renderCalendar();
    fillSelects();
    renderSettings();
    renderSyncStatus();
  }

  function renderSummary() {
    const expenses = selectedExpenses();
    const total = expenses.reduce((sum, expense) => sum + Number(expense.amount || 0), 0);
    $('#summary-total').textContent = total.toLocaleString('ja-JP');
    $('#summary-title').textContent = state.month.getFullYear() === new Date().getFullYear() && state.month.getMonth() === new Date().getMonth()
      ? '今月の支出' : state.month.getFullYear() + '年 ' + (state.month.getMonth() + 1) + '月の支出';
    const budget = state.data.budget && Number(state.data.budget.amount);
    const budgetPanel = $('#budget-summary');
    budgetPanel.hidden = !budget;
    if (budget) {
      $('#budget-limit').textContent = money(budget);
      const remaining = budget - total;
      $('#budget-remaining').textContent = remaining >= 0 ? '残り ' + money(remaining) : '超過 ' + money(Math.abs(remaining));
      const percent = Math.min(100, Math.round(total / budget * 100));
      $('#budget-progress').setAttribute('aria-valuenow', String(percent));
      $('.progress-fill', $('#budget-progress')).style.width = percent + '%';
    }
    renderCategoryBreakdown(expenses, total);
    renderCategoryTrend();
    const walletSources = active(state.data.sources || []).filter((source) => source.walletEnabled);
    $('#wallet-card').hidden = walletSources.length === 0;
    $('#wallet-balances').replaceChildren(...walletSources.map((source) => {
      const row = document.createElement('div'); row.className = 'wallet-balance-row';
      const name = document.createElement('span'); name.textContent = source.name;
      const balance = document.createElement('strong'); balance.textContent = money(source.balance);
      row.append(name, balance); return row;
    }));
  }

  function groupByCategory(expenses) {
    const totals = new Map();
    expenses.forEach((expense) => {
      const id = String(expense.categoryId || '');
      const entry = totals.get(id) || { id: id, name: labelFor('categories', id), amount: 0 };
      entry.amount += Number(expense.amount || 0);
      totals.set(id, entry);
    });
    return [...totals.values()].sort((left, right) => right.amount - left.amount);
  }

  function renderCategoryBreakdown(expenses, total) {
    const container = $('#category-breakdown');
    container.replaceChildren();
    const categories = groupByCategory(expenses);
    if (!categories.length) { container.append(emptyState('この月の支出はありません。')); return; }
    let cumulative = 0;
    const gradient = categories.map((category) => {
      const start = cumulative;
      cumulative += category.amount / total * 100;
      return categoryColor(category.id) + ' ' + start.toFixed(2) + '% ' + cumulative.toFixed(2) + '%';
    }).join(', ');
    const donut = document.createElement('div');
    donut.id = 'category-donut'; donut.className = 'category-donut'; donut.setAttribute('role', 'img');
    donut.setAttribute('aria-label', 'カテゴリ別支出の円グラフ、合計 ' + money(total));
    donut.style.background = 'conic-gradient(' + gradient + ')';
    const center = document.createElement('span'); center.className = 'category-donut-center';
    const caption = document.createElement('span'); caption.textContent = '合計';
    const centerValue = document.createElement('strong'); centerValue.textContent = total.toLocaleString('ja-JP');
    center.append(caption, centerValue); donut.append(center);
    const legend = document.createElement('div'); legend.className = 'category-legend';
    categories.forEach((category) => {
      const row = document.createElement('div'); row.className = 'category-legend-row';
      const swatch = document.createElement('span'); swatch.className = 'category-legend-swatch'; swatch.style.backgroundColor = categoryColor(category.id);
      const name = document.createElement('span'); name.className = 'category-legend-name'; name.textContent = category.name;
      const amount = document.createElement('strong'); amount.textContent = money(category.amount);
      row.append(swatch, name, amount); legend.append(row);
    });
    container.append(donut, legend);
  }

  function filteredExpenses() {
    const memberId = $('#filter-member')?.value || 'all';
    const sourceId = $('#filter-source')?.value || 'all';
    return (state.data.expenses || []).filter((expense) =>
      (memberId === 'all' || String(expense.memberId) === memberId) && (sourceId === 'all' || String(expense.sourceId) === sourceId));
  }

  function renderCategoryTrend() {
    const monthsContainer = $('#category-trend-months');
    const legendContainer = $('#category-trend-legend');
    if (!monthsContainer || !legendContainer) return;
    const months = [];
    for (let offset = 11; offset >= 0; offset -= 1) {
      const date = new Date(state.month.getFullYear(), state.month.getMonth() - offset, 1);
      months.push({ key: monthKey(localDate(date)), label: (date.getMonth() + 1) + '月', fullLabel: date.getFullYear() + '年' + (date.getMonth() + 1) + '月', totals: new Map() });
    }
    const byMonth = new Map(months.map((month) => [month.key, month]));
    filteredExpenses().forEach((expense) => {
      const bucket = byMonth.get(expenseMonth(expense));
      if (!bucket) return;
      const categoryId = String(expense.categoryId || '');
      bucket.totals.set(categoryId, (bucket.totals.get(categoryId) || 0) + Number(expense.amount || 0));
    });
    const categoryIds = [...new Set(months.flatMap((month) => [...month.totals.keys()]))];
    const maxTotal = Math.max(0, ...months.map((month) => [...month.totals.values()].reduce((sum, amount) => sum + amount, 0)));
    monthsContainer.replaceChildren(); legendContainer.replaceChildren();
    months.forEach((month) => {
      const column = document.createElement('div'); column.className = 'category-trend-column';
      const stack = document.createElement('div'); stack.className = 'category-trend-stack';
      const monthTotal = [...month.totals.values()].reduce((sum, amount) => sum + amount, 0);
      stack.setAttribute('aria-label', month.fullLabel + '、支出 ' + money(monthTotal));
      categoryIds.forEach((id) => {
        const amount = month.totals.get(id) || 0;
        if (!amount || !maxTotal) return;
        const segment = document.createElement('span'); segment.className = 'category-trend-segment';
        segment.style.height = Math.max(1, amount / maxTotal * 96) + 'px';
        segment.style.backgroundColor = categoryColor(id);
        segment.title = labelFor('categories', id) + ' ' + money(amount);
        stack.append(segment);
      });
      const label = document.createElement('span'); label.className = 'category-trend-label'; label.textContent = month.label;
      column.setAttribute('aria-label', month.fullLabel + 'のカテゴリ別支出');
      column.append(stack, label); monthsContainer.append(column);
    });
    categoryIds.forEach((id) => {
      const item = document.createElement('span'); item.className = 'category-trend-legend-item';
      const swatch = document.createElement('span'); swatch.className = 'category-legend-swatch'; swatch.style.backgroundColor = categoryColor(id);
      const label = document.createElement('span'); label.textContent = labelFor('categories', id);
      item.append(swatch, label); legendContainer.append(item);
    });
    if (!categoryIds.length) legendContainer.append(emptyState('支出が記録されると月ごとの推移を表示します。'));
  }

  function emptyState(message) { const element = document.createElement('p'); element.className = 'empty-state'; element.textContent = message; return element; }

  function transactionNode(expense, allowActions) {
    const row = document.createElement('article'); row.className = 'transaction-row'; row.dataset.expenseId = expense.id;
    const mark = document.createElement('span'); mark.className = 'transaction-icon'; mark.setAttribute('aria-hidden', 'true'); mark.textContent = Array.from(labelFor('categories', expense.categoryId, '・'))[0];
    const copy = document.createElement('span'); copy.className = 'transaction-copy';
    const memo = document.createElement('strong'); memo.textContent = expense.memo || labelFor('categories', expense.categoryId);
    const details = document.createElement('small'); details.textContent = `${expense.date} ・ ${labelFor('members', expense.memberId)} ・ ${labelFor('sources', expense.sourceId)} ・ ${labelFor('categories', expense.categoryId)}${expense.placeId ? ' ・ ' + labelFor('places', expense.placeId) : ''}`;
    copy.append(memo, details);
    const amount = document.createElement('strong'); amount.className = 'transaction-amount'; amount.textContent = '−' + money(expense.amount);
    row.append(mark, copy, amount);
    if (allowActions) {
      const actions = document.createElement('span'); actions.className = 'transaction-actions';

  function renderCalendar() {
    const grid = $('#calendar-grid');
    if (!grid) return;
    const year = state.month.getFullYear(); const monthIndex = state.month.getMonth();
    const firstDay = new Date(year, monthIndex, 1).getDay();
    const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
    const expenses = selectedExpenses();
    const daily = new Map();
    expenses.forEach((expense) => daily.set(Number(expense.date.slice(8, 10)), (daily.get(Number(expense.date.slice(8, 10))) || 0) + Number(expense.amount)));
    const dailyValues = Array.from({ length: daysInMonth }, (_, index) => daily.get(index + 1) || 0);
    const positiveValues = dailyValues.filter((amount) => amount > 0);
    const percentileLimit = percentile95(dailyValues) || percentile95(positiveValues);
    const cells = [];
    for (let index = 0; index < firstDay; index += 1) { const blank = document.createElement('span'); blank.className = 'calendar-day calendar-blank'; blank.setAttribute('aria-hidden', 'true'); cells.push(blank); }
    for (let day = 1; day <= daysInMonth; day += 1) {
      const button = document.createElement('button'); button.type = 'button'; button.className = 'calendar-day'; button.setAttribute('role', 'gridcell');
      button.dataset.day = String(day); button.setAttribute('aria-label', year + '年' + (monthIndex + 1) + '月' + day + '日' + (daily.has(day) ? '、支出 ' + money(daily.get(day)) : ''));
      if (daily.has(day)) button.classList.add('has-expense');
      if (daily.has(day) && percentileLimit > 0) {
        const relativeAmount = Math.min(daily.get(day) / percentileLimit, 1);
        button.style.setProperty('--heat-intensity', (0.12 + 0.72 * Math.sqrt(relativeAmount)).toFixed(3));
      }
      if (state.selectedDay === day) button.classList.add('is-selected');
      const number = document.createElement('span'); number.textContent = String(day); button.append(number);
      if (daily.has(day)) { const amount = document.createElement('small'); amount.textContent = daily.get(day).toLocaleString('ja-JP'); button.append(amount); }
      button.addEventListener('click', () => { state.selectedDay = day; renderCalendar(); });
      cells.push(button);
    }
    grid.replaceChildren(...cells);
    const date = year + '-' + String(monthIndex + 1).padStart(2, '0') + '-' + String(state.selectedDay).padStart(2, '0');
    const dayExpenses = expenses.filter((expense) => expense.date === date).sort(byDateDescending);
    $('#calendar-day-title').textContent = (monthIndex + 1) + '月' + state.selectedDay + '日の支出';
    $('#calendar-day-total').textContent = money(dayExpenses.reduce((sum, expense) => sum + Number(expense.amount || 0), 0));
    renderTransactions($('#calendar-day-transactions'), dayExpenses, false);
  }

  function percentile95(values) {
    if (!values.length) return 0;
    const sorted = values.slice().sort((left, right) => left - right);
    const position = (sorted.length - 1) * 0.95;
    const lower = Math.floor(position); const upper = Math.ceil(position);
    return sorted[lower] + (sorted[upper] - sorted[lower]) * (position - lower);
  }

    state.confirmed = false; state.syncStatus = 'checking'; renderSyncStatus();
    try {

      state.data = data; state.user = data.user; state.confirmed = true;
      state.fetchedAt = new Date().toISOString(); state.syncStatus = 'ready'; state.topUpRefreshPending = false;

  async function onFormSubmit(event) {
    const form = event.target;
    const type = form.dataset.form;
    if (!type) return;
    event.preventDefault();
    if (!requireEditing()) return;
    if (type === 'topup' && state.topUpRefreshPending) {
      announce('直前の補充はすでに保存されています。画面を更新できていないため、再読み込み後に台帳を確認してください。', true);
      return;
    }
    if (pendingForms.has(form)) return;
    pendingForms.add(form);
    const submitButtons = $$('button[type="submit"]', form);
    submitButtons.forEach((button) => { button.disabled = true; });
    if (form.elements.requestId && !form.elements.requestId.value) form.elements.requestId.value = newRequestId();
    if (type === 'expense' || type === 'topup') form.dataset.requestAttempted = 'true';
    if (type === 'topup') captureTopUpDraft(form);
    const value = readForm(form);
    try {
      if (type === 'expense') {
        await api('saveExpense', value); await refreshData(value.id ? '支出を更新しました。' : '支出を保存しました。'); resetExpenseForm(true);
      } else if (type === 'user') {
        await api('saveUser', value); await refreshData('ユーザー設定を保存しました。'); form.reset(); form.elements.active.checked = true; form.elements.originalEmail.value = '';
      } else if (type === 'master') {
        await api('saveMaster', state.activeMaster, value); await refreshData('マスタを保存しました。'); form.reset(); form.elements.active.checked = true; form.elements.openingBalance.value = '0';
      } else if (type === 'topup') {
        await api('addWalletTopUp', { requestId: value.requestId, sourceId: value.topupSourceId, date: value.date, amount: value.amount, memo: value.memo });
        state.topUpDraft = createTopUpDraft();
        state.topUpRefreshPending = true;
        restoreTopUpDraft($('#topupForm'), state.topUpDraft);
        announce('財布の補充を記録しました。');
        try {
          await refreshData();
          state.topUpRefreshPending = false;
          announce('財布の補充を記録しました。');
        } catch (refreshError) {
          announce('補充は保存されましたが、画面を更新できませんでした。再読み込みして台帳を確認してください。');
        }
      } else if (type === 'budget') {
        await api('saveBudget', value.amount || '0'); await refreshData('月予算を保存しました。');
      } else if (type === 'fixedCosts' || type === 'emailRules') {
        await api('saveSettingRecord', type, value); await refreshData(type === 'fixedCosts' ? '固定費の設定を保存しました。' : 'メール分類ルールを保存しました。'); form.reset();
      }
    } catch (error) { announce(error.message, true); }
    finally { pendingForms.delete(form); submitButtons.forEach((button) => { button.disabled = !canEdit(); delete button.dataset.syncDisabled; }); updateEditingControls(); }
  }

  async function onSettingsClick(event) {
    const target = event.target.closest('button'); if (!target) return;
    if (!target.dataset.masterTab && !requireEditing()) return;
    try {
      if (target.hasAttribute('data-initialize-ledger')) {
        await api('initializeFamilyLedger'); await refreshData(); announce('家族用シートを初期化しました。'); return;

      if (target.dataset.masterTab) { state.activeMaster = target.dataset.masterTab; updateMasterFormType(); return; }
      if (target.hasAttribute('data-reset-master')) { $('#masterForm').reset(); $('#masterForm').elements.id.value = ''; $('#masterForm').elements.active.checked = true; updateMasterFormType(); return; }
      if (target.dataset.editUser) {

        if (user) { loadFormRecord($('#userForm'), user); $('#userForm').elements.originalEmail.value = user.email; }
        return;
      }
      if (target.dataset.editMaster) {
        const record = lookup(state.data[state.activeMaster], target.dataset.editMaster); if (record) loadFormRecord($('#masterForm'), record); return;
      }
      if (target.dataset.toggleMaster) {
        const record = lookup(state.data[state.activeMaster], target.dataset.toggleMaster);
        if (record) { await api('setMasterActive', state.activeMaster, record.id, !record.active); await refreshData('マスタの有効状態を更新しました。'); }
        return;
      }
      if (target.dataset.editSetting) {
        const [type, id] = target.dataset.editSetting.split(':'); const record = lookup(state.data[type], id);
        if (record) loadFormRecord($('#' + (type === 'fixedCosts' ? 'fixedCostForm' : 'emailRuleForm')), record); return;
      }
      if (target.dataset.deleteSetting) {
        const [type, id] = target.dataset.deleteSetting.split(':');
        if (window.confirm('この設定を削除しますか？')) { await api('deleteSettingRecord', type, id); await refreshData('設定を削除しました。'); }
      }
    } catch (error) { announce(error.message, true); }
  }

  async function onAppClick(event) {
    const viewButton = event.target.closest('[data-view]');
    if (viewButton && viewButton.closest('.bottom-nav')) { showView(viewButton.dataset.view); if (viewButton.dataset.view === 'input' && !$('#expense-form').elements.date.value) resetExpenseForm(); }
    const viewLink = event.target.closest('[data-view-link]'); if (viewLink) { event.preventDefault(); showView(viewLink.dataset.viewLink); }
    const editButton = event.target.closest('[data-edit-expense]'); if (editButton) startEditExpense(editButton.dataset.editExpense);
    const deleteButton = event.target.closest('[data-delete-expense]');
    if (deleteButton && requireEditing() && window.confirm('この支出を削除しますか？')) {
      try { await api('deleteExpense', deleteButton.dataset.deleteExpense); await refreshData('支出を削除しました。'); }
      catch (error) { announce(error.message, true); }
    }
  }

  function bindEvents() {
    document.addEventListener('click', onAppClick);
    $('#settings-content').addEventListener('click', onSettingsClick);
    document.addEventListener('submit', onFormSubmit);
    $('#filter-member').addEventListener('change', renderAll);
    $('#filter-source').addEventListener('change', renderAll);
    $$('[data-month-step]').forEach((button) => button.addEventListener('click', () => {
      state.month = new Date(state.month.getFullYear(), state.month.getMonth() + Number(button.dataset.monthStep), 1);
      state.selectedDay = Math.min(state.selectedDay, new Date(state.month.getFullYear(), state.month.getMonth() + 1, 0).getDate()); renderAll();
    }));
    $('#expense-cancel').addEventListener('click', () => { if (requireEditing()) resetExpenseForm(); });
    ['#retry-data-button', '#retry-login-button'].forEach((selector) => $(selector).addEventListener('click', () => { $('#retry-login-button').hidden = true; refreshData().catch((error) => announce(error.message, true)); }));
    window.addEventListener('storage', (event) => {
      if (event.key === sessionStorageKey && event.newValue !== state.sessionId && state.sessionId) {
        const previousSessionId = state.sessionId;
        clearAuthentication('別のタブでログイン状態が変更されました。Googleアカウントでログインしてください。');
        try {
          const saved = JSON.parse(window.localStorage.getItem(dataStorageKey) || 'null');
          if (saved && saved.sessionId === previousSessionId) removeStoredData();
        } catch (error) { removeStoredData(); }
      }
      if (event.key === null && state.sessionId) clearAuthentication('ブラウザーの保存状態が削除されました。Googleアカウントでログインしてください。');
    });
    $('#settings-content').addEventListener('change', (event) => {
      if (event.target.name === 'walletEnabled' && $('#masterForm')) $('.opening-balance-field', $('#masterForm')).hidden = !event.target.checked;
      if (event.target.closest('#topupForm')) captureTopUpDraft();
    });
    $('#settings-content').addEventListener('input', (event) => {
      if (event.target.closest('#topupForm')) captureTopUpDraft();
    });
    $('#logout-button').addEventListener('click', () => {
      const sessionId = state.sessionId;
      clearAuthentication('ログアウトしました。', true);
      const epoch = state.sessionEpoch;
      if (sessionId) {
        apiWithSession('logoutFamilySession', sessionId).catch(() => {
          if (epoch !== state.sessionEpoch || state.sessionId) return;
          $('#login-status').textContent = 'サーバーでのログアウト処理に失敗しました。ブラウザーのログイン状態は削除しました。';
        });
      }
    });
  }

  function boot() {
    $('#expense-form').dataset.form = 'expense';
    bindEvents();
    initializeAuthentication();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true }); else boot();
})();
</script>
